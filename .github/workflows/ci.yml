name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # Self-hosting: the tool gates its own repository. The committed manifest
      # is the snapshot, so this fails the moment the tool adds undocumented I/O.
      - name: Self-check
        run: go run ./cmd/io-surface check --root .

      # Facts freshness: a committed manifest that no longer matches the tree
      # means someone shipped code without regenerating facts.cue. Safe since
      # init --force only rewrites facts.cue (claims/baseline/schema survive).
      # The audit's commit/date lines legitimately drift (HEAD moves between
      # the refresh commit and CI), so the gate ignores exactly those.
      - name: Facts are fresh
        run: |
          go run ./cmd/io-surface init --root . --force
          if ! git diff --quiet \
            -I'^[[:space:]]*commit:' \
            -I'^[[:space:]]*date:' \
            docs/architecture/io-surface/facts.cue; then
            echo "::error::facts.cue is stale — run 'go run ./cmd/io-surface init --root . --force' and commit the result"
            git diff docs/architecture/io-surface/facts.cue
            exit 1
          fi

      - name: Self-render is stable
        run: go run ./cmd/io-surface render --root . > /dev/null

      # Document freshness: the embedded inventory block in INVENTORY.md must
      # match the committed manifest.
      - name: Inventory doc is fresh
        run: go run ./cmd/io-surface render --root . --doc docs/architecture/io-surface/INVENTORY.md --check

      # Formatter parity (TODO #58): the generated block must survive a
      # dprint pass, or the first local `dprint fmt` after an honest render
      # would redden the --check gate. Verified locally before wiring.
      - name: Inventory survives dprint
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          dprint-flags: "docs/architecture/io-surface/INVENTORY.md"

      # Self-hosted SARIF: the gate's own findings as a machine-renderable
      # artifact (GitHub can display SARIF natively; a clean run yields an
      # empty results list, which still proves the emission path).
      - name: Emit self-hosted SARIF
        run: go run ./cmd/io-surface check --root . --format sarif > io-surface.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-surface-sarif
          path: io-surface.sarif
          if-no-files-found: error

      # Docs battery: the five doc gates (freshness, audit-all, annotate,
      # routing, cadence) as one standing gate. Pinned to a docs-gates rev so
      # a fleet-side rule change cannot redden this repo silently — bump the
      # pin deliberately, rerun the battery locally first.
      - name: Docs gates
        run: go run github.com/Artmann-Technologies/docs-gates/cmd/docs-gates@2278406afdfd run

  # Capability facts (v1.1, advisory): the reachability half of the unified
  # gate. This is the ONLY place the external engine runs — the `test` job
  # above stays hermetic (GOPROXY-independent, sandbox-clean) by contract.
  # Everything here is non-blocking by design: capability findings never fail
  # CI; they inform. Bump CAPSLOCK_VERSION deliberately (schema churn).
  capabilities:
    runs-on: ubuntu-latest
    env:
      CAPSLOCK_VERSION: v0.3.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Install with the SAME toolchain the target repo loads with: a
      # version-skewed analyzer fails to type-check the stdlib internals
      # (observed locally with go1.26-built capslock on a go1.27 tree).
      - name: Install pinned Capslock (toolchain-matched)
        run: go install github.com/google/capslock/cmd/capslock@${CAPSLOCK_VERSION}

      - name: Reachability report
        run: $(go env GOPATH)/bin/capslock -output=json -packages=./... > capslock.json

      - name: Absorb advisory drift report
        run: |
          go run ./cmd/io-surface absorb --capslock capslock.json --check
          echo "Capability facts are advisory: drift above never fails CI (ROADMAP Q5 / plan guardrail 2)."

      - name: Upload capability report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capslock-report
          path: capslock.json
          if-no-files-found: error

  # Module-path tripwire (TODO #44): the public path is the product — a
  # rename or a broken go.mod would silently kill every consumer's
  # `go install`. Installs the module through the public proxy from a clean
  # module cache and runs the real binary.
  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install from the public module path
        run: go install github.com/larsartmann/io-surface/cmd/io-surface@latest

      - name: The binary runs
        run: |
          v="$($(go env GOPATH)/bin/io-surface version)"
          echo "installed: $v"
          case "$v" in
            io-surface\ *) exit 0 ;;
            *) echo "::error::unexpected version output: $v"; exit 1 ;;
          esac
