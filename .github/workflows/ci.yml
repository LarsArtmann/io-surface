name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # Self-hosting: the tool gates its own repository. The committed manifest
      # is the snapshot, so this fails the moment the tool adds undocumented I/O.
      - name: Self-check
        run: go run ./cmd/io-surface check --root .

      # Facts freshness: a committed manifest that no longer matches the tree
      # means someone shipped code without regenerating facts.cue. Safe since
      # init --force only rewrites facts.cue (claims/baseline/schema survive).
      # The audit's commit/date lines legitimately drift (HEAD moves between
      # the refresh commit and CI), so the gate ignores exactly those.
      - name: Facts are fresh
        run: |
          go run ./cmd/io-surface init --root . --force
          if ! git diff --quiet \
            -I'^[[:space:]]*commit:' \
            -I'^[[:space:]]*date:' \
            docs/architecture/io-surface/facts.cue; then
            echo "::error::facts.cue is stale — run 'go run ./cmd/io-surface init --root . --force' and commit the result"
            git diff docs/architecture/io-surface/facts.cue
            exit 1
          fi

      - name: Self-render is stable
        run: go run ./cmd/io-surface render --root . > /dev/null

      # Document freshness: the embedded inventory block in INVENTORY.md must
      # match the committed manifest.
      - name: Inventory doc is fresh
        run: go run ./cmd/io-surface render --root . --doc docs/architecture/io-surface/INVENTORY.md --check

      # Self-hosted SARIF: the gate's own findings as a machine-renderable
      # artifact (GitHub can display SARIF natively; a clean run yields an
      # empty results list, which still proves the emission path).
      - name: Emit self-hosted SARIF
        run: go run ./cmd/io-surface check --root . --format sarif > io-surface.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-surface-sarif
          path: io-surface.sarif
          if-no-files-found: error
